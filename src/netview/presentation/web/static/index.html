<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>netview</title>
<link rel="stylesheet" id="theme-light" media="(prefers-color-scheme: light)" href="/static/themes/daylight.css">
<link rel="stylesheet" id="theme-dark" media="(prefers-color-scheme: dark)" href="/static/themes/graphite.css">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<header class="topbar">
  <span class="brand">netview</span>
  <div class="meta" id="meta"></div>
  <nav class="nav" id="nav" aria-label="Pages"></nav>
  <button id="btnScan" class="primary" type="button" disabled>Scan now</button>
  <span class="live" id="live" role="status"><span class="dot"></span><span id="liveText">Connecting…</span></span>
  <button id="btnSettings" class="icon" type="button" aria-label="Settings" title="Settings"></button>
</header>
<div class="wrap">
  <main id="view"></main>
</div>
<dialog id="report" class="dlg report" aria-labelledby="report-title">
  <div class="dlg-head">
    <div class="report-title"><h2 id="report-title"></h2><div class="scope" id="report-sub"></div></div>
    <span class="spacer"></span>
    <button type="button" data-run>Run again</button>
    <button type="button" data-all title="Scan all 65,535 TCP ports (about a minute)">All ports</button>
    <button type="button" data-close>Close</button>
  </div>
  <div class="dlg-pane report-body">
    <div class="report-live" id="report-live"></div>
    <p id="report-status" role="status" class="note"></p>
    <div class="report-sections" id="report-sections"></div>
  </div>
</dialog>
<script type="module" src="/static/js/main.js"></script>
</body>
</html>
