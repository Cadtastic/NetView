<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1930 176" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>NETGEAR GSM7248 front panel</title>
  <!-- Head-on drawing of the switch face. port-grid.js holds the matching jack geometry: keep the two in step. -->
  <defs>
    <!-- RJ45 jack, top-row orientation (latch notch and LEDs at the top). Cell is 54 x 52. -->
    <g id="pt">
      <rect x="1" y="1" width="52" height="50" fill="#c9c5b8" stroke="#8d897c"/>
      <rect x="5" y="4" width="9" height="5" fill="#33402f"/>
      <rect x="40" y="4" width="9" height="5" fill="#33402f"/>
      <rect x="19" y="5" width="16" height="7" fill="#111"/>
      <rect x="8" y="11" width="38" height="32" fill="#161616"/>
      <path d="M14 37H41" stroke="#c9a646" stroke-width="9" stroke-dasharray="1.6 2"/>
    </g>
    <g id="pb"><use href="#pt" transform="translate(0,52) scale(1,-1)"/></g>
    <!-- 2 x 6 jack block, 328 x 104 -->
    <g id="blk">
      <rect x="0" y="-2" width="328" height="108" fill="#a9a59a"/>
      <use href="#pt" x="2"/><use href="#pt" x="56"/><use href="#pt" x="110"/><use href="#pt" x="164"/><use href="#pt" x="218"/><use href="#pt" x="272"/>
      <use href="#pb" x="2" y="52"/><use href="#pb" x="56" y="52"/><use href="#pb" x="110" y="52"/><use href="#pb" x="164" y="52"/><use href="#pb" x="218" y="52"/><use href="#pb" x="272" y="52"/>
    </g>
    <!-- SFP cage 64 x 40 with its LED to the left -->
    <g id="sfp">
      <circle cx="-12" cy="20" r="4.5" fill="#1d2a1c" stroke="#16224a"/>
      <rect width="64" height="40" fill="#bdb9ae" stroke="#8d897c"/>
      <rect x="4" y="4" width="56" height="28" fill="#1b1b1b"/>
      <path d="M10 36H54" stroke="#6f6c63" stroke-width="3" stroke-dasharray="10 6"/>
    </g>
  </defs>

  <rect x="4" y="8" width="84" height="160" rx="6" fill="#294487"/>
  <rect x="1842" y="8" width="84" height="160" rx="6" fill="#294487"/>
  <g fill="#0c0f18" fill-opacity=".6">
    <rect x="22" y="26" width="40" height="18" rx="9"/><rect x="22" y="132" width="40" height="18" rx="9"/>
    <rect x="1868" y="26" width="40" height="18" rx="9"/><rect x="1868" y="132" width="40" height="18" rx="9"/>
  </g>
  <rect x="85" y="2" width="1760" height="172" fill="#2f4d9b"/>
  <rect x="85" y="2" width="1760" height="5" fill="#4a69bb"/>
  <rect x="85" y="169" width="1760" height="5" fill="#213874"/>
  <text x="97" y="30" fill="#fff" font-size="14" font-weight="700" letter-spacing="1.5">NETGEAR</text>
  <text x="97" y="46" fill="#fff" font-size="10.5">L2 Managed</text>
  <text x="97" y="59" fill="#fff" font-size="10.5">Gigabit Switch</text>
  <circle cx="112" cy="126" r="4" fill="#0d1226"/>
  <circle cx="144" cy="126" r="4.5" fill="#46f06b" stroke="#16224a"/>
  <text x="112" y="146" fill="#fff" font-size="9" text-anchor="middle">Reset</text>
  <text x="144" y="146" fill="#fff" font-size="9" text-anchor="middle">Power</text>
  <use href="#blk" x="179" y="36"/><use href="#blk" x="529" y="36"/><use href="#blk" x="879" y="36"/><use href="#blk" x="1229" y="36"/>
  <use href="#sfp" x="1597" y="40"/><use href="#sfp" x="1689" y="40"/>
  <use href="#sfp" x="1597" y="100"/><use href="#sfp" x="1689" y="100"/>
  <circle cx="1801" cy="48" r="5" fill="#c9b27a" stroke="#6b5d36"/>
  <circle cx="1801" cy="132" r="5" fill="#c9b27a" stroke="#6b5d36"/>
  <rect x="1781" y="57" width="40" height="66" rx="9" fill="#cfcfcf" stroke="#777"/>
  <rect x="1789" y="66" width="24" height="48" rx="7" fill="#262626"/>
  <path d="M1797 73V109" stroke="#d6b65a" stroke-width="3" stroke-dasharray="3 3.6"/>
  <path d="M1805 77V105" stroke="#d6b65a" stroke-width="3" stroke-dasharray="3 3.6"/>

  <g fill="#fff" font-size="12" font-weight="600" text-anchor="middle">
    <g transform="translate(0,29)">
      <text x="208">1</text><text x="262">3</text><text x="316">5</text><text x="370">7</text><text x="424">9</text><text x="478">11</text>
      <text x="558">13</text><text x="612">15</text><text x="666">17</text><text x="720">19</text><text x="774">21</text><text x="828">23</text>
      <text x="908">25</text><text x="962">27</text><text x="1016">29</text><text x="1070">31</text><text x="1124">33</text><text x="1178">35</text>
      <text x="1258">37</text><text x="1312">39</text><text x="1366">41</text><text x="1420">43</text><text x="1474">45T</text><text x="1528">47T</text>
      <text x="1629">45F</text><text x="1721">47F</text>
    </g>
    <g transform="translate(0,158)">
      <text x="208">2</text><text x="262">4</text><text x="316">6</text><text x="370">8</text><text x="424">10</text><text x="478">12</text>
      <text x="558">14</text><text x="612">16</text><text x="666">18</text><text x="720">20</text><text x="774">22</text><text x="828">24</text>
      <text x="908">26</text><text x="962">28</text><text x="1016">30</text><text x="1070">32</text><text x="1124">34</text><text x="1178">36</text>
      <text x="1258">38</text><text x="1312">40</text><text x="1366">42</text><text x="1420">44</text><text x="1474">46T</text><text x="1528">48T</text>
      <text x="1629">46F</text><text x="1721">48F</text>
    </g>
  </g>
</svg>
