[project]
name = "netview"
version = "0.1.0"
description = "Plugin-based LAN monitor with a local web UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "typer>=0.12",
    "platformdirs>=4",
    "packaging>=24",
    "swagger-ui-bundle>=1.1",
    "pysnmp>=7.1,<8",
    "cryptography>=43",
]

[project.scripts]
netview = "netview.presentation.cli:app"

[project.entry-points."netview.plugins"]
lan_discovery = "netview.plugins.builtin.lan_discovery.plugin:LanDiscoveryPlugin"
health = "netview.plugins.builtin.health.plugin:HealthPlugin"
identity = "netview.plugins.builtin.identity.plugin:IdentityPlugin"
local_host = "netview.plugins.builtin.local_host.plugin:LocalHostPlugin"
inspection = "netview.plugins.builtin.inspection.plugin:InspectionPlugin"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netview"]
artifacts = [
    "src/netview/presentation/web/static/**",
    "src/netview/plugins/builtin/*/static/**",
    "src/netview/plugins/builtin/*/migrations/**",
    "src/netview/infrastructure/db/**/*.mako",
]

[tool.ruff]
target-version = "py311"
line-length = 110
# A byte-identical copy of the shared scripts library file; it is served to users, not imported.
extend-exclude = ["plugins/roku/static/find_rokus.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# `mypy src plugins` checks the optional plugins too, but not the tests inside their folders, nor the
# roku plugin's find_rokus.py, a byte-identical copy of the shared scripts library file served to users
exclude = ["tests", "conftest", "plugins/roku/static/"]

[[tool.mypy.overrides]]
module = ["netview.domain.*", "netview.application.*", "netview.sdk.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests", "plugins"]
markers = ["snmp: needs a local UDP SNMP responder (pysnmp) on 127.0.0.1"]

[tool.importlinter]
root_package = "netview"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is pure"
type = "forbidden"
source_modules = ["netview.domain"]
forbidden_modules = [
    "netview.application",
    "netview.infrastructure",
    "netview.presentation",
    "netview.sdk",
    "netview.plugins",
    "netview.bootstrap",
    "sqlalchemy",
    "fastapi",
    "pydantic",
    "starlette",
    "alembic",
]

[[tool.importlinter.contracts]]
name = "Application has no adapters"
type = "forbidden"
source_modules = ["netview.application"]
forbidden_modules = [
    "netview.infrastructure",
    "netview.presentation",
    "netview.plugins",
    "netview.bootstrap",
    "sqlalchemy",
    "fastapi",
    "starlette",
    "alembic",
]

[[tool.importlinter.contracts]]
name = "Infrastructure does not know the web layer"
type = "forbidden"
source_modules = ["netview.infrastructure"]
forbidden_modules = [
    "netview.presentation",
    "netview.plugins",
    "netview.bootstrap",
]

[[tool.importlinter.contracts]]
name = "Presentation uses application only"
type = "forbidden"
source_modules = ["netview.presentation"]
forbidden_modules = [
    "netview.infrastructure",
    "netview.plugins",
    "netview.bootstrap",
]
ignore_imports = ["netview.presentation.cli -> netview.bootstrap"]

[[tool.importlinter.contracts]]
name = "The SDK is a facade"
type = "forbidden"
source_modules = ["netview.sdk"]
forbidden_modules = [
    "netview.infrastructure",
    "netview.presentation",
    "netview.plugins",
    "netview.bootstrap",
]

[[tool.importlinter.contracts]]
name = "Plugins use the SDK only"
type = "forbidden"
source_modules = ["netview.plugins"]
forbidden_modules = [
    "netview.domain",
    "netview.application",
    "netview.infrastructure",
    "netview.presentation",
    "netview.bootstrap",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Built-in plugins are independent"
type = "independence"
modules = [
    "netview.plugins.builtin.lan_discovery",
    "netview.plugins.builtin.health",
    "netview.plugins.builtin.identity",
    "netview.plugins.builtin.local_host",
    "netview.plugins.builtin.inspection",
]
